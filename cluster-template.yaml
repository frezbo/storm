---
kind: Cluster
name: storm
kubernetes:
  version: 1.37.2
  manifests:
    # Native BuildKit needs ContainerConfig seccompProfile (Talos v1.15.0-beta.0),
    # which Omni v1.13.3's embedded machinery rejects as an unknown key.
    - name: buildkitd
      mode: full
      file: cluster-server/buildkitd.yaml
talos:
  version: v1.15.0-beta.0
features:
  enableWorkloadProxy: true
patches:
  - file: patches/multihoming.yaml
  - file: patches/sandboxd.yaml
  - file: patches/fstrim.yaml
  - file: patches/fsscrub.yaml
---
kind: ControlPlane
machines:
  - 27f13b80-49af-11ef-9b05-8814a3404d00
patches:
  # Still needed: CoreDNS (Omni-managed Kubernetes plumbing) must schedule
  # on this single control-plane node.
  - file: patches/controlplane-allow-scheduling.yaml
---
kind: Workers
---
kind: Machine
systemExtensions:
  - siderolabs/amd-ucode
  - siderolabs/tailscale
  - siderolabs/libvirtd
name: 27f13b80-49af-11ef-9b05-8814a3404d00
