---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: registries
volumeType: partition
provisioning:
  diskSelector:
    match: system_disk
  minSize: 120GiB
  maxSize: 120GiB
filesystem:
  type: xfs
encryption:
  provider: luks2
  allowDiscards: true
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
      lockToState: true
    - slot: 1
      kms:
        endpoint: https://frezbo.siderolink.eu-central-1.omni.siderolabs.io
      lockToState: true
