# Registry + pull-through mirrors as Talos containers (was the
# cluster-server/registry-mirrors.yaml Deployment).
#
# Each registry mounts the whole `registries` user volume
# (/var/mnt/registries) at /var/lib/registry. Its storage root is then pointed
# at the subdirectory the Deployment used as a subPath, so each one keeps
# reading and writing the same host directory:
#   /var/mnt/registries/<push|docker-io|registry-k8s-io|...>
# Ports and debug ports are the same as before (main 1500N, debug 1510N on
# loopback).
---
apiVersion: v1alpha1
kind: ContainerConfig
name: registry-push
image: ghcr.io/distribution/distribution:edge
environment:
  - REGISTRY_HTTP_ADDR=0.0.0.0:15000
  - REGISTRY_HTTP_DEBUG_ADDR=127.0.0.1:15100
  - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry/push
  - REGISTRY_STORAGE_DELETE_ENABLED=true
  - REGISTRY_LOG_LEVEL=info
  - OTEL_TRACES_EXPORTER=none
network:
  mode: host
mounts:
  - userVolume:
      name: registries
      destination: /var/lib/registry
  - tmpfs:
      destination: /tmp
---
