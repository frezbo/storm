  - REGISTRY_PROXY_REMOTEURL=https://index.docker.io
  - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry/docker-io
  - REGISTRY_STORAGE_DELETE_ENABLED=true
  - REGISTRY_LOG_LEVEL=info
