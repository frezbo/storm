              "${TS_CERT_DOMAIN}:5009": {
                  "Handlers": {
                      "/": {
                          "Proxy": "http://127.0.0.1:15009"
                      }
                  }
              },
              "${TS_CERT_DOMAIN}:5010": {
                  "Handlers": {
                      "/": {
                          "Proxy": "http://127.0.0.1:15010"
                      }
                  }
              },
              "${TS_CERT_DOMAIN}:5011": {
                  "Handlers": {
