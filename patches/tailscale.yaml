                  }
              },
              "${TS_CERT_DOMAIN}:5005": {
                  "Handlers": {
                      "/": {
                          "Proxy": "http://127.0.0.1:15005"
                      }
                  }
              },
              "${TS_CERT_DOMAIN}:5006": {
                  "Handlers": {
                      "/": {
